<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MetaTrader‑Style Trading Dashboard</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <header class="mt-header">
        <div class="mt-title">Thetis Trading Bot</div>
        <div id="mt-status" class="mt-status-badge offline">
            <span class="mt-status-dot"></span><span class="mt-status-text">Offline</span>
        </div>
    </header>
    <div class="mt-container">
        <!-- Left panel: Market Watch -->
        <aside class="mt-sidebar" id="mt-market-watch">
            <h2 class="mt-panel-title">Market Watch</h2>
            <table class="mt-watch-table" id="mt-watch-body">
                <thead>
                    <tr><th>Symbol</th><th>Bid</th><th>Ask</th></tr>
                </thead>
                <tbody>
                    <!-- Filled dynamically (placeholder) -->
                    <tr><td colspan="3" class="mt-empty">No data</td></tr>
                </tbody>
            </table>
        </aside>
        <!-- Main panel: Chart -->
        <main class="mt-main">
            <div class="mt-chart-wrapper">
                <canvas id="mt-price-canvas"></canvas>
            </div>
            <div class="mt-signal-panel" id="mt-signal-panel">
                <span id="mt-signal" class="mt-signal-display hold">—</span>
                <div id="mt-signal-meta" class="mt-signal-meta"></div>
            </div>
        </main>
        <!-- Right panel: Order Entry & Stats -->
        <aside class="mt-sidebar" id="mt-right-panel">
            <section class="mt-panel">
                <h2 class="mt-panel-title">Account</h2>
                <div class="mt-metric"><span>Cash:</span> <span id="mt-cash">$0.00</span></div>
                <div class="mt-metric"><span>Buying Power:</span> <span id="mt-bp">$0.00</span></div>
                <div class="mt-metric"><span>Trades:</span> <span id="mt-trades">0</span></div>
                <div class="mt-metric"><span>Iter:</span> <span id="mt-iter">0</span></div>
            </section>
            <section class="mt-panel">
                <h2 class="mt-panel-title">Order Entry</h2>
                <div class="mt-form-group">
                    <label for="mt-symbol">Symbol</label>
                    <input type="text" id="mt-symbol" placeholder="AAPL" />
                </div>
                <div class="mt-form-group">
                    <label for="mt-qty">Qty</label>
                    <input type="number" id="mt-qty" min="1" value="1" />
                </div>
                <div class="mt-form-group">
                    <label for="mt-delay">Loop Delay (s)</label>
                    <input type="number" id="mt-delay" min="1" value="10" />
                </div>
                <button class="mt-btn mt-btn-start" id="mt-start-btn">Start</button>
                <button class="mt-btn mt-btn-stop" id="mt-stop-btn" disabled>Stop</button>
            </section>
            <section class="mt-panel">
                <h2 class="mt-panel-title">Trade Log</h2>
                <div class="mt-log-count" id="mt-log-count">0 entries</div>
                <div class="mt-log-table-wrap">
                    <table class="mt-log-table" id="mt-log-body">
                        <thead>
                            <tr>
                                <th>#</th><th>Time</th><th>Signal</th><th>Close</th><th>Action</th><th>Cash</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>
        </aside>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
